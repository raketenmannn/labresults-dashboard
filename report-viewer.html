<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laborbericht</title>
    <meta name="theme-color" content="#174c3c">
    <link rel="icon" href="./favicon.svg?v=20260903-radiology-finding1" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=20260903-radiology-finding1">
    <link rel="manifest" href="./site.webmanifest?v=20260903-radiology-finding1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #f4f1e9;
        --panel: #fffdf8;
        --ink: #17211c;
        --muted: #59655f;
        --line: #deddd5;
        --green: #174c3c;
        --mint: #dfece4;
        --coral: #ef775c;
        --shadow: 0 12px 34px rgba(31, 51, 42, 0.09);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 2;
        min-height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 253, 248, 0.96);
        box-shadow: var(--shadow);
        backdrop-filter: blur(8px);
      }

      h1 {
        margin: 0;
        font-family: "Manrope", system-ui, sans-serif;
        font-size: 16px;
        font-weight: 750;
        letter-spacing: 0;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      .meta {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      a,
      button {
        border: 1px solid var(--line);
        border-radius: 13px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0;
        padding: 7px 10px;
        text-decoration: none;
        white-space: nowrap;
      }

      a:hover,
      button:hover {
        border-color: var(--green);
        background: var(--mint);
        color: var(--green);
      }

      a:focus-visible,
      button:focus-visible {
        outline: 3px solid rgba(239, 119, 92, 0.35);
        outline-offset: 2px;
      }

      .iconButton {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        padding: 0;
      }

      .iconButton svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .pdfSearch {
        position: fixed;
        top: 76px;
        right: 20px;
        z-index: 4;
        display: grid;
        grid-template-columns: minmax(180px, 300px) auto auto auto auto;
        align-items: center;
        gap: 6px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: rgba(255, 253, 248, 0.98);
        box-shadow: var(--shadow);
        backdrop-filter: blur(8px);
      }

      .pdfSearch[hidden] {
        display: none;
      }

      .pdfSearchField {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        height: 38px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: white;
      }

      .pdfSearchField:focus-within {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(23, 76, 60, 0.10);
      }

      .pdfSearchField svg {
        flex: 0 0 auto;
        width: 17px;
        height: 17px;
        fill: none;
        stroke: var(--muted);
        stroke-linecap: round;
        stroke-width: 2;
      }

      .pdfSearchField input {
        min-width: 0;
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-size: 14px;
      }

      .pdfSearchCount {
        min-width: 54px;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        text-align: center;
        white-space: nowrap;
      }

      .pdfSearch .iconButton {
        width: 32px;
        height: 32px;
      }

      .pdfSearch .iconButton:disabled {
        cursor: default;
        opacity: 0.4;
      }

      main {
        width: min(1100px, 100%);
        margin: 0 auto;
        padding: 24px;
      }

      .status {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        box-shadow: var(--shadow);
        color: var(--muted);
        padding: 14px;
      }

      .status input {
        min-height: 44px;
        font: inherit;
        outline: 0;
      }

      .status input:focus {
        border-color: var(--green) !important;
        box-shadow: 0 0 0 4px rgba(23, 76, 60, 0.10);
      }

      .status button {
        min-height: 44px;
        border-color: var(--green);
        background: var(--green);
        color: var(--panel);
      }

      .progressStatus {
        position: sticky;
        top: 76px;
        z-index: 1;
      }

      .page {
        margin: 0 auto 20px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .pageLabel {
        border-bottom: 1px solid var(--line);
        background: rgba(223, 236, 228, 0.52);
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
        padding: 8px 10px;
      }

      .pageSurface {
        --user-unit: 1;
        --total-scale-factor: calc(var(--scale-factor) * var(--user-unit));
        --scale-round-x: 1px;
        --scale-round-y: 1px;
        position: relative;
        max-width: 100%;
        margin: 0 auto;
        overflow: hidden;
      }

      .pageSurface.isPending::before {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 0;
        color: var(--muted);
        content: "Seite wird geladen …";
        font-size: 12px;
        transform: translate(-50%, -50%);
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        background: white;
      }

      .textLayer {
        position: absolute;
        inset: 0;
        z-index: 1;
        overflow: clip;
        color-scheme: only light;
        line-height: 1;
        text-align: initial;
        transform-origin: 0 0;
        -webkit-text-size-adjust: none;
        text-size-adjust: none;
        forced-color-adjust: none;
        caret-color: CanvasText;
      }

      .textLayer :is(span, br) {
        position: absolute;
        color: transparent;
        white-space: pre;
        cursor: text;
        transform-origin: 0% 0%;
      }

      .textLayer {
        --min-font-size: 1;
        --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size));
        --min-font-size-inv: calc(1 / var(--min-font-size));
      }

      .textLayer > :not(.markedContent),
      .textLayer .markedContent span:not(.markedContent) {
        z-index: 1;
        --font-height: 0;
        --scale-x: 1;
        --rotate: 0deg;
        font-size: calc(var(--text-scale-factor) * var(--font-height));
        transform: rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv));
      }

      .textLayer .markedContent {
        display: contents;
      }

      .textLayer span[role="img"] {
        cursor: default;
        user-select: none;
      }

      .textLayer ::selection {
        background: rgba(23, 76, 60, 0.28);
      }

      .textLayer mark.pdfSearchMatch {
        border-radius: 2px;
        background: rgba(239, 119, 92, 0.48);
        box-shadow: 0 0 0 1px rgba(190, 72, 46, 0.28);
        color: transparent;
      }

      .textLayer mark.pdfSearchMatch.isActive {
        background: rgba(255, 178, 32, 0.78);
        box-shadow: 0 0 0 2px rgba(23, 76, 60, 0.72);
      }

      [data-main-rotation="90"] {
        transform: rotate(90deg) translateY(-100%);
      }

      [data-main-rotation="180"] {
        transform: rotate(180deg) translate(-100%, -100%);
      }

      [data-main-rotation="270"] {
        transform: rotate(270deg) translateX(-100%);
      }

      .hiddenCanvasElement {
        position: absolute;
        top: 0;
        left: 0;
        display: none;
        width: 0;
        height: 0;
      }

      @media (max-width: 640px) {
        header {
          align-items: flex-start;
          flex-direction: column;
          gap: 10px;
          padding: 10px 12px;
        }

        .actions {
          width: 100%;
          justify-content: flex-start;
        }

        .pdfSearch {
          top: 118px;
          right: 10px;
          left: 10px;
          grid-template-columns: minmax(0, 1fr) auto auto auto;
        }

        .pdfSearchField {
          grid-column: 1 / -1;
        }

        a,
        button {
          padding: 7px 9px;
          font-size: 12px;
        }

        main {
          padding: 10px;
        }

        .page {
          margin-bottom: 10px;
          border-radius: 14px;
        }

        .progressStatus {
          top: 112px;
        }
      }

      @media print {
        body {
          background: white;
        }

        header,
        .pdfSearch,
        .progressStatus,
        .pageLabel {
          display: none !important;
        }

        main {
          width: 100%;
          padding: 0;
        }

        .page {
          margin: 0 0 12px;
          border: 0;
          border-radius: 0;
          box-shadow: none;
          break-after: page;
          page-break-after: always;
        }

        .page:last-child {
          break-after: auto;
          page-break-after: auto;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1 id="title">Laborbericht</h1>
        <div id="meta" class="meta">Lade PDF...</div>
      </div>
      <div class="actions">
        <button id="backButton" type="button">Zurück</button>
        <button id="searchButton" class="iconButton" type="button" aria-label="Im Dokument suchen" title="Im Dokument suchen (⌘F)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-4-4"></path>
          </svg>
        </button>
        <button id="shareButton" class="iconButton" type="button" aria-label="Dokument teilen" title="Dokument teilen">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path>
            <path d="M12 16V3"></path>
            <path d="m7 8 5-5 5 5"></path>
          </svg>
        </button>
        <button id="printButton" class="iconButton" type="button" aria-label="Dokument drucken" title="Dokument drucken">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 8V3h10v5"></path>
            <path d="M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"></path>
            <path d="M7 14h10v7H7z"></path>
          </svg>
        </button>
        <a id="pdfLink" class="iconButton" href="#" download aria-label="PDF herunterladen" title="PDF herunterladen">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12"></path>
            <path d="m7 10 5 5 5-5"></path>
            <path d="M5 21h14"></path>
          </svg>
        </a>
      </div>
    </header>

    <form id="pdfSearch" class="pdfSearch" role="search" aria-label="PDF durchsuchen" hidden>
      <label class="pdfSearchField">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m20 20-4-4"></path>
        </svg>
        <input id="pdfSearchInput" type="search" inputmode="search" autocomplete="off" placeholder="Im Bericht suchen" aria-label="Im Bericht suchen">
      </label>
      <output id="pdfSearchCount" class="pdfSearchCount" for="pdfSearchInput" aria-live="polite">0 Treffer</output>
      <button id="pdfSearchPrevious" class="iconButton" type="button" aria-label="Vorheriger Treffer" title="Vorheriger Treffer" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 15 6-6 6 6"></path>
        </svg>
      </button>
      <button id="pdfSearchNext" class="iconButton" type="submit" aria-label="Nächster Treffer" title="Nächster Treffer" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 9 6 6 6-6"></path>
        </svg>
      </button>
      <button id="pdfSearchClose" class="iconButton" type="button" aria-label="Suche schließen" title="Suche schließen">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18"></path>
        </svg>
      </button>
    </form>

    <main id="viewer">
      <div class="status">PDF wird geladen...</div>
    </main>

    <script type="module">
      import * as pdfjsLib from "./vendor/pdfjs/pdf.mjs";

      pdfjsLib.GlobalWorkerOptions.workerSrc = "./vendor/pdfjs/pdf.worker.mjs";

      const params = new URLSearchParams(window.location.search);
      const file = params.get("file") || "";
      const collection = params.get("collection") || "pdf";
      const requestedPage = Math.max(1, Number(params.get("page") || 1));
      const viewer = document.getElementById("viewer");
      const title = document.getElementById("title");
      const meta = document.getElementById("meta");
      const pdfLink = document.getElementById("pdfLink");
      const backButton = document.getElementById("backButton");
      const searchButton = document.getElementById("searchButton");
      const shareButton = document.getElementById("shareButton");
      const printButton = document.getElementById("printButton");
      const pdfSearch = document.getElementById("pdfSearch");
      const pdfSearchInput = document.getElementById("pdfSearchInput");
      const pdfSearchCount = document.getElementById("pdfSearchCount");
      const pdfSearchPrevious = document.getElementById("pdfSearchPrevious");
      const pdfSearchNext = document.getElementById("pdfSearchNext");
      const pdfSearchClose = document.getElementById("pdfSearchClose");
      const PASSWORD_STORAGE_KEY = "labResultsUnlockPassword";
      const COLLECTIONS = {
        pdf: { localDir: "../reports/pdf", secureDir: "pdfs", fallbackTitle: "Laborbericht" },
        findings: { localDir: "../reports/findings", secureDir: "findings", fallbackTitle: "Befund" },
        allergies: { localDir: "../reports/allergies", secureDir: "allergies", fallbackTitle: "Allergie- und Unverträglichkeitstest" },
      };
      const LEGACY_FILE_ALIASES = {
        "2026-05-15_Zentrallabor-MHH_Blutbild-Gerinnung-HbA1c.pdf": "2026-05-15_Diamedis_Blutbild-Gerinnung-HbA1c.pdf",
        "2026-05-26_Zentrallabor-MHH_Klinische-Chemie-Schilddruese.pdf": "2026-05-26_Diamedis_Klinische-Chemie-Schilddruese.pdf",
      };
      let currentFileName = "";
      let currentPdfBlob = null;
      let pdfIsReady = false;
      let searchMatches = [];
      let activeSearchMatch = -1;
      let pageObserver = null;
      const pageEntries = new Map();
      const canvasCache = [];
      const maxRenderedCanvases = window.matchMedia("(max-width: 640px)").matches ? 3 : 8;
      const originalSpanText = new WeakMap();

      function searchableTextSpans() {
        return [...document.querySelectorAll(".textLayer span")].filter((span) => !span.querySelector("span"));
      }

      function restoreSearchSpans() {
        searchableTextSpans().forEach((span) => {
          if (!originalSpanText.has(span)) return;
          span.replaceChildren(document.createTextNode(originalSpanText.get(span)));
        });
      }

      function setSearchControlsEnabled(enabled) {
        pdfSearchPrevious.disabled = !enabled;
        pdfSearchNext.disabled = !enabled;
      }

      function updateSearchCount() {
        if (!pdfSearchInput.value.trim()) {
          pdfSearchCount.textContent = pdfIsReady ? "0 Treffer" : "PDF lädt";
          return;
        }
        if (!searchMatches.length) {
          pdfSearchCount.textContent = "Keine Treffer";
          return;
        }
        const activePage = searchMatches[activeSearchMatch]?.[0]?.closest(".page")?.id.replace("page-", "");
        const pageLabel = activePage ? ` · S. ${activePage}` : "";
        pdfSearchCount.textContent = `${activeSearchMatch + 1} / ${searchMatches.length}${pageLabel}`;
      }

      function activateSearchMatch(index, shouldScroll = true) {
        document.querySelectorAll(".pdfSearchMatch.isActive").forEach((mark) => mark.classList.remove("isActive"));
        if (!searchMatches.length) {
          activeSearchMatch = -1;
          updateSearchCount();
          return;
        }
        activeSearchMatch = (index + searchMatches.length) % searchMatches.length;
        const activeMarks = searchMatches[activeSearchMatch];
        activeMarks.forEach((mark) => mark.classList.add("isActive"));
        if (shouldScroll) {
          activeMarks[0]?.scrollIntoView({ behavior: "smooth", block: "center", inline: "nearest" });
        }
        updateSearchCount();
      }

      function renderSpanMatches(span, ranges) {
        const text = originalSpanText.get(span) || "";
        const fragment = document.createDocumentFragment();
        let cursor = 0;
        ranges.sort((a, b) => a.start - b.start).forEach(({ start, end, matchIndex }) => {
          if (start > cursor) fragment.append(document.createTextNode(text.slice(cursor, start)));
          const mark = document.createElement("mark");
          mark.className = "pdfSearchMatch";
          mark.dataset.searchMatch = String(matchIndex);
          mark.textContent = text.slice(start, end);
          fragment.append(mark);
          searchMatches[matchIndex].push(mark);
          cursor = end;
        });
        if (cursor < text.length) fragment.append(document.createTextNode(text.slice(cursor)));
        span.replaceChildren(fragment);
      }

      function separatorBetweenParts(previousPart, currentPart) {
        if (!previousPart) return "";
        if (/\s$/.test(previousPart.text) || /^\s/.test(currentPart.text)) return "";
        const previousRect = previousPart.span.getBoundingClientRect();
        const currentRect = currentPart.span.getBoundingClientRect();
        const lineTolerance = Math.max(2, Math.min(previousRect.height, currentRect.height) * 0.45);
        const sameLine = Math.abs(previousRect.top - currentRect.top) <= lineTolerance;
        if (!sameLine) return "\n";
        const gap = currentRect.left - previousRect.right;
        const joinTolerance = Math.max(1.5, Math.min(previousRect.height, currentRect.height) * 0.16);
        return gap <= joinTolerance ? "" : " ";
      }

      function searchProjection(value) {
        const characters = [];
        for (let sourceIndex = 0; sourceIndex < value.length; sourceIndex += 1) {
          const character = value[sourceIndex];
          if (/\s/.test(character)) {
            if (!characters.length || characters.at(-1).character === " ") continue;
            characters.push({ character: " ", sourceIndex });
          } else {
            characters.push({ character: character.toLocaleLowerCase("de"), sourceIndex });
          }
        }
        const punctuation = /[:;,.!?/\\()\[\]{}%+\-=<>]/;
        const compact = characters.filter((entry, index) => {
          if (entry.character !== " ") return true;
          const previous = characters[index - 1]?.character || "";
          const next = characters[index + 1]?.character || "";
          return !punctuation.test(previous) && !punctuation.test(next);
        });
        return {
          text: compact.map((entry) => entry.character).join(""),
          sourceIndices: compact.map((entry) => entry.sourceIndex),
        };
      }

      function runPdfSearch() {
        restoreSearchSpans();
        searchMatches = [];
        activeSearchMatch = -1;
        const query = searchProjection(pdfSearchInput.value.trim()).text;
        if (!query || !pdfIsReady) {
          setSearchControlsEnabled(false);
          updateSearchCount();
          return;
        }

        document.querySelectorAll(".textLayer").forEach((layer) => {
          const spans = [...layer.querySelectorAll("span")].filter((span) => !span.querySelector("span"));
          const parts = [];
          let pageText = "";
          spans.forEach((span) => {
            const text = originalSpanText.get(span) ?? span.textContent ?? "";
            originalSpanText.set(span, text);
            const part = { span, text, start: 0, end: 0, ranges: [] };
            pageText += separatorBetweenParts(parts.at(-1), part);
            const start = pageText.length;
            pageText += text;
            part.start = start;
            part.end = pageText.length;
            parts.push(part);
          });

          const projectedPageText = searchProjection(pageText);
          const searchablePageText = projectedPageText.text;
          let searchFrom = 0;
          while (searchFrom <= searchablePageText.length - query.length) {
            const foundAt = searchablePageText.indexOf(query, searchFrom);
            if (foundAt === -1) break;
            const foundEnd = foundAt + query.length;
            const sourceStart = projectedPageText.sourceIndices[foundAt];
            const sourceEnd = projectedPageText.sourceIndices[foundEnd - 1] + 1;
            const matchIndex = searchMatches.length;
            const matchingParts = parts.filter((part) => part.end > sourceStart && part.start < sourceEnd);
            if (matchingParts.length) {
              searchMatches.push([]);
              matchingParts.forEach((part) => {
                part.ranges.push({
                  start: Math.max(0, sourceStart - part.start),
                  end: Math.min(part.end, sourceEnd) - part.start,
                  matchIndex,
                });
              });
            }
            searchFrom = foundAt + Math.max(1, query.length);
          }

          parts.filter((part) => part.ranges.length).forEach((part) => renderSpanMatches(part.span, part.ranges));
        });

        setSearchControlsEnabled(searchMatches.length > 0);
        activateSearchMatch(searchMatches.length ? 0 : -1, false);
      }

      function positionPdfSearch() {
        const headerBottom = document.querySelector("header")?.getBoundingClientRect().bottom || 64;
        pdfSearch.style.top = `${Math.max(8, headerBottom + 8)}px`;
      }

      function openPdfSearch() {
        positionPdfSearch();
        pdfSearch.hidden = false;
        pdfSearchInput.focus();
        pdfSearchInput.select();
        if (pdfSearchInput.value.trim()) runPdfSearch();
        else updateSearchCount();
      }

      function closePdfSearch() {
        pdfSearch.hidden = true;
        restoreSearchSpans();
        searchMatches = [];
        activeSearchMatch = -1;
        setSearchControlsEnabled(false);
        searchButton.focus();
      }

      searchButton.addEventListener("click", openPdfSearch);
      pdfSearchInput.addEventListener("input", runPdfSearch);
      pdfSearch.addEventListener("submit", (event) => {
        event.preventDefault();
        activateSearchMatch(activeSearchMatch + 1);
      });
      pdfSearchPrevious.addEventListener("click", () => activateSearchMatch(activeSearchMatch - 1));
      pdfSearchClose.addEventListener("click", closePdfSearch);
      pdfSearchInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          activateSearchMatch(activeSearchMatch + (event.shiftKey ? -1 : 1));
        } else if (event.key === "Escape") {
          event.preventDefault();
          closePdfSearch();
        }
      });
      document.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key.toLocaleLowerCase("de") === "f") {
          event.preventDefault();
          openPdfSearch();
        } else if ((event.metaKey || event.ctrlKey) && event.key.toLocaleLowerCase("de") === "g") {
          event.preventDefault();
          if (pdfSearch.hidden) openPdfSearch();
          else activateSearchMatch(activeSearchMatch + (event.shiftKey ? -1 : 1));
        } else if (event.key === "F3" && !pdfSearch.hidden) {
          event.preventDefault();
          activateSearchMatch(activeSearchMatch + (event.shiftKey ? -1 : 1));
        } else if (event.key === "Escape" && !pdfSearch.hidden) {
          event.preventDefault();
          closePdfSearch();
        }
      });
      window.addEventListener("resize", () => {
        if (!pdfSearch.hidden) positionPdfSearch();
      });

      function safeFileName(name) {
        return name.split(/[\\/]/).pop();
      }

      function canonicalFileName(name) {
        const cleanName = safeFileName(name);
        return LEGACY_FILE_ALIASES[cleanName] || cleanName;
      }

      function base64ToBytes(value) {
        const padding = value.endsWith("==") ? 2 : value.endsWith("=") ? 1 : 0;
        const bytes = new Uint8Array(Math.floor((value.length * 3) / 4) - padding);
        const chunkSize = 32768;
        let targetOffset = 0;
        for (let sourceOffset = 0; sourceOffset < value.length; sourceOffset += chunkSize) {
          const binary = atob(value.slice(sourceOffset, sourceOffset + chunkSize));
          for (let index = 0; index < binary.length; index += 1) {
            bytes[targetOffset] = binary.charCodeAt(index);
            targetOffset += 1;
          }
        }
        return bytes;
      }

      async function derivePasswordKey(password, salt, iterations) {
        const material = await crypto.subtle.importKey(
          "raw",
          new TextEncoder().encode(password),
          "PBKDF2",
          false,
          ["deriveKey"],
        );
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", hash: "SHA-256", salt, iterations },
          material,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"],
        );
      }

      async function decryptBinaryPayload(payload, password) {
        const salt = base64ToBytes(payload.salt);
        const iv = base64ToBytes(payload.iv);
        const ciphertext = base64ToBytes(payload.ciphertext);
        const key = await derivePasswordKey(password, salt, payload.iterations);
        const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
        payload.ciphertext = "";
        return new Uint8Array(plain);
      }

      function savedPassword() {
        return sessionStorage.getItem(PASSWORD_STORAGE_KEY) || localStorage.getItem(PASSWORD_STORAGE_KEY);
      }

      function rememberSessionPassword(password) {
        sessionStorage.setItem(PASSWORD_STORAGE_KEY, password);
      }

      function forgetSavedPassword() {
        sessionStorage.removeItem(PASSWORD_STORAGE_KEY);
        localStorage.removeItem(PASSWORD_STORAGE_KEY);
      }

      function mailtoShareUrl(fileName) {
        const subject = `Dokument: ${fileName}`;
        const body = `Hier ist der Link zum Dokument:\\n${window.location.href}`;
        return `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      }

      async function shareDocument() {
        const fileName = currentFileName || safeFileName(file) || "Dokument.pdf";
        const text = "Dokument aus dem Gesundheitsdaten-Dashboard";
        try {
          if (currentPdfBlob && window.File && navigator.canShare) {
            const shareFile = new File([currentPdfBlob], fileName, { type: "application/pdf" });
            if (navigator.canShare({ files: [shareFile] })) {
              await navigator.share({ title: fileName, text, files: [shareFile] });
              return;
            }
          }
          if (navigator.share) {
            await navigator.share({ title: fileName, text, url: window.location.href });
            return;
          }
        } catch (error) {
          if (error?.name === "AbortError") return;
        }
        window.location.href = mailtoShareUrl(fileName);
      }

      function askPassword() {
        viewer.innerHTML = `
          <form id="pdfAuth" class="status">
            <strong>Bericht entsperren</strong><br>
            <span>Gib das Kennwort ein, um diese verschlüsselte PDF zu öffnen.</span><br><br>
            <input id="pdfPassword" type="password" autocomplete="current-password" required style="width:min(340px,100%);padding:9px 12px;border:1px solid var(--line);border-radius:13px;">
            <button type="submit">Entsperren</button>
            <div id="pdfAuthMessage" style="margin-top:8px;color:#b8403a;font-size:13px;"></div>
          </form>
        `;
        const form = document.getElementById("pdfAuth");
        const input = document.getElementById("pdfPassword");
        const message = document.getElementById("pdfAuthMessage");
        input.focus();
        return new Promise((resolve) => {
          form.addEventListener("submit", (event) => {
            event.preventDefault();
            message.textContent = "";
            resolve(input.value);
          });
        });
      }

      function showStatus(text, className = "status") {
        viewer.innerHTML = "";
        const element = document.createElement("div");
        element.className = className;
        element.textContent = text;
        viewer.append(element);
        return element;
      }

      async function loadPdfData(cleanFile, pdfUrl, secureDir) {
        try {
          const response = await fetch(pdfUrl);
          if (response.ok) {
            const data = new Uint8Array(await response.arrayBuffer());
            const blob = new Blob([data], { type: "application/pdf" });
            const objectUrl = URL.createObjectURL(blob);
            pdfLink.href = objectUrl;
            pdfLink.download = cleanFile;
            return { source: objectUrl, data, blob };
          }
        } catch {
          // Public GitHub Pages builds do not include plaintext PDFs.
        }

        const encryptedUrl = `./secure-data/${secureDir}/${encodeURIComponent(cleanFile)}.enc`;
        const encryptedResponse = await fetch(encryptedUrl, { cache: "no-store" });
        if (!encryptedResponse.ok) throw new Error(`Verschlüsselte PDF konnte nicht geladen werden: ${encryptedResponse.status}`);
        const payload = await encryptedResponse.json();
        let password = savedPassword();
        while (true) {
          if (!password) password = await askPassword();
          try {
            const data = await decryptBinaryPayload(payload, password);
            rememberSessionPassword(password);
            const blob = new Blob([data], { type: payload.contentType || "application/pdf" });
            const objectUrl = URL.createObjectURL(blob);
            pdfLink.href = objectUrl;
            pdfLink.download = cleanFile;
            return { source: objectUrl, data, blob };
          } catch {
            forgetSavedPassword();
            password = "";
            const message = document.getElementById("pdfAuthMessage");
            if (message) message.textContent = "Kennwort stimmt nicht oder die PDF ist beschädigt.";
          }
        }
      }

      function touchCanvasEntry(entry) {
        const existingIndex = canvasCache.indexOf(entry);
        if (existingIndex >= 0) canvasCache.splice(existingIndex, 1);
        canvasCache.push(entry);
      }

      function releaseCanvas(entry) {
        if (!entry?.rendered || entry.renderPromise) return;
        entry.canvas.width = 1;
        entry.canvas.height = 1;
        entry.rendered = false;
        entry.surface.classList.add("isPending");
      }

      function trimCanvasCache(activeEntry) {
        while (canvasCache.filter((entry) => entry.rendered).length > maxRenderedCanvases) {
          const candidate = canvasCache.find((entry) => (
            entry !== activeEntry
            && !entry.isVisible
            && entry.rendered
            && !entry.renderPromise
          ));
          if (!candidate) return;
          canvasCache.splice(canvasCache.indexOf(candidate), 1);
          releaseCanvas(candidate);
        }
      }

      async function renderPageCanvas(entry, preserveAll = false) {
        if (!entry) return;
        if (entry.rendered) {
          touchCanvasEntry(entry);
          if (!preserveAll) trimCanvasCache(entry);
          return;
        }
        if (entry.renderPromise) return entry.renderPromise;
        entry.renderPromise = (async () => {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          entry.canvas.width = Math.max(1, Math.floor(entry.viewport.width * dpr));
          entry.canvas.height = Math.max(1, Math.floor(entry.viewport.height * dpr));
          const context = entry.canvas.getContext("2d");
          context.setTransform(dpr, 0, 0, dpr, 0, 0);
          await entry.page.render({ canvasContext: context, viewport: entry.viewport }).promise;
          entry.rendered = true;
          entry.surface.classList.remove("isPending");
          touchCanvasEntry(entry);
          if (!preserveAll) trimCanvasCache(entry);
        })().finally(() => {
          entry.renderPromise = null;
        });
        return entry.renderPromise;
      }

      async function renderAllPageCanvases() {
        pageObserver?.disconnect();
        for (const entry of pageEntries.values()) {
          await renderPageCanvas(entry, true);
        }
      }

      async function preparePage(pdf, pageNumber) {
        const page = await pdf.getPage(pageNumber);
        const container = document.createElement("section");
        container.className = "page";
        container.dataset.pageNumber = String(pageNumber);
        container.id = `page-${pageNumber}`;
        container.innerHTML = `<div class="pageLabel">Seite ${pageNumber}</div>`;
        const surface = document.createElement("div");
        surface.className = "pageSurface isPending";
        const canvas = document.createElement("canvas");
        const textLayerElement = document.createElement("div");
        textLayerElement.className = "textLayer";
        surface.append(canvas, textLayerElement);
        container.append(surface);
        viewer.append(container);

        const baseViewport = page.getViewport({ scale: 1 });
        const availableWidth = Math.max(280, Math.min(container.clientWidth, 980));
        const scale = availableWidth / baseViewport.width;
        const viewport = page.getViewport({ scale });
        surface.style.setProperty("--scale-factor", scale);
        surface.style.width = `${viewport.width}px`;
        surface.style.aspectRatio = `${viewport.width} / ${viewport.height}`;
        canvas.width = 1;
        canvas.height = 1;
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        const syncTextLayerScale = () => {
          surface.style.setProperty("--scale-factor", surface.clientWidth / baseViewport.width);
        };
        syncTextLayerScale();
        new ResizeObserver(syncTextLayerScale).observe(surface);
        const textContent = await page.getTextContent({ includeMarkedContent: true });
        const textLayer = new pdfjsLib.TextLayer({
          textContentSource: textContent,
          container: textLayerElement,
          viewport,
        });
        await textLayer.render();
        const entry = {
          pageNumber,
          page,
          container,
          surface,
          canvas,
          viewport,
          isVisible: false,
          rendered: false,
          renderPromise: null,
        };
        pageEntries.set(pageNumber, entry);
        return entry;
      }

      async function init() {
        const requestedFile = safeFileName(file);
        const cleanFile = canonicalFileName(file);
        const collectionConfig = COLLECTIONS[collection] || COLLECTIONS.pdf;
        if (!cleanFile) {
          viewer.innerHTML = '<div class="status">Keine PDF-Datei angegeben.</div>';
          meta.textContent = "";
          return;
        }
        if (requestedFile && cleanFile !== requestedFile) {
          params.set("file", cleanFile);
          window.history.replaceState(null, "", `${window.location.pathname}?${params.toString()}${window.location.hash}`);
        }

        currentFileName = cleanFile || collectionConfig.fallbackTitle;
        title.textContent = currentFileName;
        const pdfUrl = `${collectionConfig.localDir}/${encodeURIComponent(cleanFile)}`;
        pdfLink.href = pdfUrl;
        pdfLink.download = cleanFile;
        backButton.addEventListener("click", () => {
          if (history.length > 1) history.back();
          else window.location.href = "./";
        });
        shareButton.addEventListener("click", shareDocument);
        printButton.addEventListener("click", async () => {
          await renderAllPageCanvases();
          window.print();
        });

        showStatus("PDF wird geladen...");
        const loadedPdf = await loadPdfData(cleanFile, pdfUrl, collectionConfig.secureDir);
        currentPdfBlob = loadedPdf.blob || null;
        const pdf = await pdfjsLib.getDocument(loadedPdf.data ? { data: loadedPdf.data } : loadedPdf.source).promise;
        meta.textContent = `${pdf.numPages} Seiten`;
        viewer.innerHTML = "";
        const progress = showStatus(`Seite 1 von ${pdf.numPages} wird geladen...`, "status progressStatus");
        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
          progress.textContent = `Seite ${pageNumber} von ${pdf.numPages} wird vorbereitet...`;
          await preparePage(pdf, pageNumber);
        }
        progress.remove();
        pageObserver = new IntersectionObserver((entries) => {
          entries.forEach((observerEntry) => {
            const pageNumber = Number(observerEntry.target.dataset.pageNumber);
            const entry = pageEntries.get(pageNumber);
            if (entry) entry.isVisible = observerEntry.isIntersecting;
          });
          entries.filter((entry) => entry.isIntersecting).forEach((observerEntry) => {
            const pageNumber = Number(observerEntry.target.dataset.pageNumber);
            renderPageCanvas(pageEntries.get(pageNumber)).catch((error) => {
              console.error(`Seite ${pageNumber} konnte nicht gerendert werden`, error);
            });
          });
        }, { rootMargin: "320px 0px" });
        pageEntries.forEach((entry) => pageObserver.observe(entry.container));
        const initialEntry = pageEntries.get(Math.min(requestedPage, pdf.numPages));
        await renderPageCanvas(initialEntry);
        pdfIsReady = true;
        if (pdfSearchInput.value.trim()) runPdfSearch();
        else updateSearchCount();
        initialEntry?.container.scrollIntoView();
        if (params.get("print") === "1") {
          await renderAllPageCanvases();
          setTimeout(() => window.print(), 250);
        }
      }

      init().catch((error) => {
        console.error(error);
        const directLink = pdfLink.href.startsWith("blob:")
          ? `<br><br><a href="${pdfLink.href}" target="_blank" rel="noopener">PDF direkt öffnen</a>`
          : "";
        viewer.innerHTML = `
          <div class="status">
            <strong>Der Bericht konnte in der Vorschau nicht geladen werden.</strong><br>
            <span>Versuche es erneut oder öffne die PDF direkt.</span>
            ${directLink}
            <br><br><button type="button" onclick="window.location.reload()">Erneut versuchen</button>
          </div>
        `;
        meta.textContent = "Vorschaufehler";
      });
    </script>
  </body>
</html>
